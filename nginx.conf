server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Punto de entrada HTML y scripts de bootstrap / versión: nunca almacenar en caché
    location ~* (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # 2. Archivos estáticos de lógica / código (.js, .json, .wasm): revalidación obligatoria continua
    location ~* \.(js|json|wasm)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # 3. Recursos multimedia y fuentes (.css, .png, .jpg, .jpeg, .gif, .ico, .svg, .woff, .woff2, .ttf)
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1d;
        add_header Cache-Control "public, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 4. Enrutamiento SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}