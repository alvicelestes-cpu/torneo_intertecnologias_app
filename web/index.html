<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Portal Deportivo - Torneo Intertecnologías">

  <!-- Invalidación estricta de caché para navegadores móviles y de escritorio -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Desregistrar cualquier Service Worker activo previo de inmediato antes de cargar recursos -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="torneo_intertecnologias_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Torneo Intertecnologías</title>
</head>
<body>
  <script>
    // Desactivar el banner emergente de "Instalar App" (PWA)
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      return false;
    });

    // Inyectar script de arranque de Flutter con timestamp para forzar su recarga inmediata en cada despliegue
    var script = document.createElement('script');
    var versionTimestamp = new Date().getTime();
    script.src = 'flutter_bootstrap.js?v=' + versionTimestamp;
    script.async = true;
    document.body.appendChild(script);
  </script>
</body>
</html>
